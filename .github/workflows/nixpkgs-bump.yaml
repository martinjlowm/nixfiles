name: Bump nixpkgs
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nixpkgs-bump
  cancel-in-progress: false
jobs:
  bump:
    name: Bump nixpkgs
    runs-on: ubuntu-latest
    # update-flake-lock opens the pull request with GITHUB_TOKEN, so no workflow
    # runs on it until someone pushes to the branch or closes and reopens it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Update the nixpkgs input
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          inputs: nixpkgs
          branch: chore/nixpkgs-bump
          commit-msg: 'chore(nix): bump nixpkgs-26.05-chilled'
          pr-title: 'chore(nix): bump nixpkgs-26.05-chilled'
          pr-labels: dependencies
